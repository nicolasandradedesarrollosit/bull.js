version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
      dependencies:
        dependency-type: production
    ignore:
      # The packages of this repo are linked through npm workspaces.
      - dependency-name: "@bull-js/*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
