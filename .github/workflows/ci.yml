name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint

  # The dev tooling (Vitest 5, jsdom) needs Node 22.12+, so the full suite runs on 22 and 24.
  test:
    name: Test (Node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - run: npx vitest run -c vitest.e2e.config.ts
      - name: Architecture check of the example app
        # Through the built file: `npm ci` links the `bull` binary before dist/ exists.
        run: node packages/cli/dist/bin.js check examples/todo-app

  # The published packages support Node 20.19+: build with 22, then run the CLI on 20.
  node20:
    name: Runtime on Node 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/setup-node@v7
        with:
          node-version: "20.19"
      - run: node --version
      - run: node packages/cli/dist/bin.js check examples/todo-app
      - run: node packages/cli/dist/bin.js build examples/todo-app --out-dir "$RUNNER_TEMP/todo-dist"
      - run: node packages/cli/dist/bin.js doctor examples/todo-app
