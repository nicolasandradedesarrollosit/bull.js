name: Release

on:
  push:
    branches: [main]

# One release at a time; a newer push waits for the running one.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write # npm provenance

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      - run: npm test

      # With pending changesets it opens (or updates) the "Version packages" pull request.
      # Once that pull request is merged there are none left: it publishes to npm, then pushes a
      # tag and creates a GitHub release for each published package.
      # v2 is the action for Changesets CLI v3 (v1 publishes but does not see what it published).
      - uses: changesets/action@v2.1.2
        with:
          version-script: npm run version-packages
          publish-script: npm run release
          pr-title: "chore(release): version packages"
          commit-message: "chore(release): version packages"
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
